name: Refresh market data

# Pulls fresh data into Neon via the ingest pipeline.
#   - weekdays: incremental price gap only (fast, one Yahoo call per stock)
#   - Sunday:   full refresh (company info + full dividend history + prices)
# Manual runs can pick either mode.

on:
  schedule:
    # ~10:17 UTC = ~18:17 SGT (off-peak minute -- top of the hour is congested
    # and GitHub delayed our first run ~4h). Mon-Sat: prices only. Sun: full.
    - cron: "17 10 * * 1-6"
    - cron: "17 10 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to refresh"
        type: choice
        default: prices
        options: [prices, full]

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - run: pip install -r requirements.txt

      - name: Refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
          # Sunday schedule OR a manual "full" run => full refresh; otherwise prices only.
          FULL: ${{ github.event.schedule == '17 10 * * 0' || inputs.mode == 'full' }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "full refresh"
            python -m scripts.refresh
          else
            echo "prices-only refresh"
            python -m scripts.refresh --prices-only
          fi
