services:
  - type: web
    name: singapore-dividends-api
    runtime: python
    rootDir: server
    region: singapore # same region as the Neon DB (ap-southeast-1)
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, set once the frontend is deployed
